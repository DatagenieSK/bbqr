<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BB QR Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <canvas id="fireCanvas"></canvas>

    <!-- SECURITY LOGIN SCREEN -->
    <div class="login-overlay" id="loginScreen">
        <div class="card" style="margin: 0 20px;">
            <div class="header">🔒 Security Login</div>
            <div class="content">
                <p style="font-size: 13px; margin-bottom: 20px; color: #aaa;">Please enter your Employee Code to access the QR Pro Generator.</p>
                
                <input type="text" id="empCodeInput" placeholder="Enter EMP Code..." autocomplete="off" style="text-transform: uppercase;">
                
                <p id="loginError" style="color: var(--fire-red); font-size: 12px; display: none; margin-top: -10px; margin-bottom: 15px; font-weight: bold;">Invalid Employee Code. Try again.</p>
                
                <button class="type-btn" style="width: 100%; background-color: var(--bb-green); border: none; padding: 15px;" onclick="checkLogin()">LOGIN</button>
            </div>
        </div>
    </div>

    <div class="emoji-bg" id="emojiBg">
        <div class="floating-emoji" style="top: 10%; left: 10%;">🥦</div>
        <div class="floating-emoji" style="top: 20%; right: 15%;">🥕</div>
        <div class="floating-emoji" style="bottom: 15%; left: 20%;">🛒</div>
        <div class="floating-emoji" style="bottom: 30%; right: 10%;">🍎</div>
    </div>

    <!-- MAIN CARD (Hidden initially) -->
    <div class="card" id="mainCard" style="display: none;">
        <div class="header" id="headerTitle">⚡ QR Generator Pro</div>
       
        <div class="content">
            <div class="btn-grid">
                <button class="type-btn" onclick="generateRandom('BBNOW')">BB Now<span>(BB + 9 Digits)</span></button>
                <button class="type-btn" onclick="generateRandom('MED')">Medium PBM<span>(PBM + 10 Digits)</span></button>
                <button class="type-btn" onclick="generateRandom('HED')">HED<span>(PBHM + 10 Digits)</span></button>
                <button class="type-btn" onclick="generateRandom('SMALL')">Small<span>(PBS + 10 Digits)</span></button>
                <button class="type-btn" onclick="generateRandom('LARGE')">Large<span>(PBL + 10 Digits)</span></button>
                <button class="type-btn" onclick="generateRandom('SLOT')">Slot QR<span>(BNxx-POxx)</span></button>
                <button class="type-btn" onclick="generateRandom('Gel')">Gel Pad<span>(PCM-BLU...)</span></button>
                <button class="type-btn" onclick="generateRandom('IN')">Insulated<span>(GP-IN...)</span></button>
                <button class="type-btn" onclick="generateRandom('BL')">Bulk<span>(GP-KL...)</span></button>
                <button class="type-btn" onclick="generateRandom('DS')">DISPATCH<span>(Z-03-E-3)</span></button>
                <button class="type-btn" onclick="generateRandom('SOFTBIN')">Soft Bin<span>(SOFT-BIN-FL-0)</span></button>
                <button class="type-btn" onclick="generateRandom('SBIFC')">SB IFC<span>(SB_IFC_123456)</span></button>
            </div>

            <input type="text" id="textInput" placeholder="Type text to generate..." autocomplete="off">
           
            <div id="qrcode">
                <span style="color:#555; font-size:12px; font-style:italic;">Select a type above to start</span>
            </div>
           
            <button id="dlBtn" class="download" onclick="downloadQR()">Download Image ⬇️</button>

            <div id="historyContainer" class="history-container">
                <div class="history-title">Recent Codes</div>
                <div id="historyList" class="history-list"></div>
            </div>

            <div class="credit">MADE BY <span>SK ALAUDDIN</span></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
